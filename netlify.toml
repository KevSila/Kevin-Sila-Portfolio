[build]
  command = "npm run build"
  publish = "dist"

# Keep crawler/verification files as real static files with explicit response types.
# Revalidate them on each request while Search Console setup is being completed.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/googlec555c9832d27b872.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Baseline security/quality headers for the site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# SPA fallback. Existing static files take precedence because force is false,
# so sitemap.xml, robots.txt, the verification file, JS, CSS and images stay intact.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
